<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d38"><title>IA SAFI | Marketplace</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,Arial;color:#17213a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#101d38;color:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{margin:0;color:#5ce2cb}header small{color:#bdcbe2}button,input,select,textarea{font:inherit}button{background:#1167c4;color:white;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}button.secondary{background:#e7effb;color:#174577}button.danger{background:#b92d45}nav{background:white;padding:12px 5%;display:flex;gap:8px;overflow:auto;border-bottom:1px solid #dfe6f1}nav button{white-space:nowrap}main{max-width:1150px;margin:25px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border:1px solid #e0e7f1;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #15294b09}.card h3{margin:0 0 9px}.muted{color:#63718a}.tag{display:inline-block;background:#e8f6f2;color:#067764;padding:4px 9px;border-radius:20px;font-size:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;margin:6px 0 12px;background:white}label{font-weight:600;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e8f0;font-size:14px}section[hidden]{display:none}#notice{position:fixed;bottom:15px;left:15px;right:15px;background:#0c735f;color:white;padding:13px;border-radius:10px;display:none;max-width:600px;margin:auto}.hero{background:linear-gradient(110deg,#122348,#126a91);color:white;border-radius:16px;padding:26px;margin-bottom:20px}.hero h2{margin:0 0 10px}.stat{font-size:28px;font-weight:800;color:#1454a5}.status{font-size:13px;color:#475569}footer{text-align:center;padding:25px;color:#6a778b} @media(max-width:650px){header{padding:15px}nav{padding:10px}table{display:block;overflow-x:auto}}
</style></head><body><header><div><h1>✦ IA SAFI</h1><small>Marketplace de logiciels & création de sites</small></div><div><label for="role">Espace de démonstration</label><select id="role" style="width:auto;margin:0"><option value="client">Client</option><option value="vendeur">Vendeur</option><option value="admin">Administrateur</option></select></div></header><nav id="nav"></nav><main><div class="hero"><h2>La technologie au service des entreprises</h2><p>Logiciels personnalisés, licences définitives, abonnements et sites Internet.</p><div class="status" style="color:#d3efff" id="connection"></div></div><div id="view"></div></main><div id="notice"></div><footer>IA SAFI V1 • Prototype local de démonstration • FCFA</footer><script>
const KEY='iasafi-v1-data';const starter={products:[{id:'p1',name:'SAFI Stock Pro',category:'Gestion de stock',description:'Produits, ventes, alertes et factures.',price:65000,mode:'unique',seller:'IA SAFI'},{id:'p2',name:'SAFI Gestion Boutique',category:'Commerce',description:'Gestion commerciale pour boutiques et magasins.',price:5000,mode:'mensuel',seller:'IA SAFI'},{id:'p3',name:'SAFI Transport',category:'Transport',description:'Billetterie, colis et gestion de gare.',price:95000,mode:'unique',seller:'Partenaire Démo'}],orders:[],sites:[],queue:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(starter)}catch{db=structuredClone(starter)}let role='client',page='catalogue';const $=s=>document.querySelector(s),money=n=>Number(n).toLocaleString('fr-FR')+' FCFA',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(action){db.queue.push({id:crypto.randomUUID(),action,date:new Date().toISOString()});try{localStorage.setItem(KEY,JSON.stringify(db))}catch{notify('Stockage local indisponible');return}render();notify('Enregistré localement. Synchronisation serveur non configurée.')}function notify(t){const el=$('#notice');el.textContent=t;el.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>el.style.display='none',4500)}function navigation(){const tabs=[['catalogue','Catalogue'],['sites','Sites Internet'],['commandes','Commandes']];if(role==='vendeur'||role==='admin')tabs.push(['produits','Gérer les offres']);if(role==='admin')tabs.push(['admin','Administration']);tabs.push(['sync','Hors connexion']);$('#nav').innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'':'secondary'}" data-page="${id}">${label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}function render(){if(role==='client'&&['produits','admin'].includes(page))page='catalogue';if(role==='vendeur'&&page==='admin')page='catalogue';navigation();$('#connection').textContent=(navigator.onLine?'● Connexion Internet détectée':'● Mode hors ligne')+' · Données conservées sur cet appareil';let h='';if(page==='catalogue'){h='<h2>Catalogue des logiciels</h2><div class="grid">'+db.products.map(p=>`<article class="card"><span class="tag">${esc(p.category)}</span><h3 style="margin-top:12px">${esc(p.name)}</h3><p class="muted">${esc(p.description)}</p><p><b>${money(p.price)}</b> / ${p.mode==='unique'?'paiement unique':p.mode==='mensuel'?'mois':'an'}</p><p class="muted">Vendeur : ${esc(p.seller)}</p><button data-buy="${esc(p.id)}">Commander</button></article>`).join('')+'</div>'}if(page==='sites'){h=`<h2>Demander la création d'un site Internet</h2><div class="card"><form id="siteform"><label>Nom de l'entreprise</label><input name="company" required maxlength="120"><label>Contact (téléphone ou e-mail)</label><input name="contact" required maxlength="120"><label>Type de site</label><select name="type"><option>Site vitrine</option><option>Boutique en ligne</option><option>Site institutionnel</option><option>Plateforme sur mesure</option></select><label>Décrivez votre projet</label><textarea name="details" rows="4" required maxlength="2000"></textarea><button>Envoyer la demande</button></form></div>`}if(page==='commandes'){h='<h2>Commandes enregistrées</h2><div class="card" style="overflow-x:auto"><table><thead><tr><th>Offre</th><th>Client</th><th>Montant</th><th>Statut</th></tr></thead><tbody>'+db.orders.map(o=>`<tr><td>${esc(o.product)}</td><td>${esc(o.customer)}</td><td>${money(o.price)}</td><td>${esc(o.status)}</td></tr>`).join('')+'</tbody></table>'+(db.orders.length?'':'<p>Aucune commande.</p>')+'</div><h2>Demandes de sites</h2><div class="card">'+(db.sites.map(s=>`<p><b>${esc(s.company)}</b> — ${esc(s.type)} — ${esc(s.contact)}<br><span class="muted">${esc(s.details)}</span></p>`).join('<hr>')||'Aucune demande.')+'</div>'}if(page==='produits'){h=`<h2>Publier une offre</h2><div class="card"><form id="productform"><label>Nom du logiciel</label><input name="name" required maxlength="120"><label>Catégorie</label><input name="category" required maxlength="100"><label>Description</label><textarea name="description" required maxlength="1000"></textarea><label>Nom du vendeur</label><input name="seller" required maxlength="100"><label>Prix en FCFA</label><input name="price" type="number" min="0" max="1000000000" required><label>Mode de paiement</label><select name="mode"><option value="unique">Paiement unique</option><option value="mensuel">Abonnement mensuel</option><option value="annuel">Abonnement annuel</option></select><button>Ajouter au catalogue</button></form></div>`}if(page==='admin'){const total=db.orders.reduce((s,o)=>s+o.price,0);h=`<h2>Tableau de bord administrateur</h2><div class="grid"><div class="card">Offres publiées<div class="stat">${db.products.length}</div></div><div class="card">Commandes<div class="stat">${db.orders.length}</div></div><div class="card">Demandes de sites<div class="stat">${db.sites.length}</div></div><div class="card">Valeur des commandes<div class="stat">${money(total)}</div></div></div><div class="card"><b>Important :</b> ces chiffres représentent des commandes de démonstration, pas des paiements encaissés.</div>`}if(page==='sync'){h=`<h2>Mode hors connexion</h2><div class="card"><p>Les opérations sont sauvegardées dans le stockage local de ce navigateur.</p><p><b>${db.queue.length}</b> opération(s) locale(s) en attente d'une future synchronisation serveur.</p><p class="muted">Cette version ne transmet aucune donnée à un serveur. Elle ne permet pas de partager les commandes entre appareils. Sauvegardez régulièrement les données.</p><div class="actions"><button id="export">Exporter les données JSON</button><button class="secondary" id="importbtn">Importer une sauvegarde</button><input id="importfile" type="file" accept="application/json" hidden></div></div>`}$('#view').innerHTML=h;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const p=db.products.find(x=>x.id===b.dataset.buy);const customer=prompt('Nom du client ou de l’entreprise :');if(!customer?.trim())return;db.orders.push({id:crypto.randomUUID(),product:p.name,customer:customer.trim().slice(0,120),price:p.price,status:'En attente de paiement',date:new Date().toISOString()});save('Commande '+p.id)});const sf=$('#siteform');if(sf)sf.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(sf));db.sites.push({id:crypto.randomUUID(),...v,date:new Date().toISOString()});save('Demande site')};const pf=$('#productform');if(pf)pf.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(pf));db.products.push({...v,id:crypto.randomUUID(),price:Number(v.price)});save('Offre ajoutée')};const exp=$('#export');if(exp)exp.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='ia-safi-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const imp=$('#importbtn');if(imp)imp.onclick=()=>$('#importfile').click();const file=$('#importfile');if(file)file.onchange=async()=>{try{const d=JSON.parse(await file.files[0].text());if(!Array.isArray(d.products)||!Array.isArray(d.orders)||!Array.isArray(d.sites)||!Array.isArray(d.queue))throw Error('Format invalide');if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;db=d;localStorage.setItem(KEY,JSON.stringify(db));render();notify('Sauvegarde importée')}catch(e){notify('Import impossible : '+e.message)}}}$('#role').onchange=e=>{role=e.target.value;page='catalogue';render()};window.addEventListener('online',render);window.addEventListener('offline',render);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
